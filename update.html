<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV → app.js 更新ツール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="update.css" />
</head>
<body>
  <main class="panel">
    <header>
      <p class="eyebrow">Quote Calendar</p>
      <h1>CSV → app.js 更新</h1>
      <p class="lead">CSVを選んで、埋め込み名言データを app.js に反映します。</p>
    </header>

    <section class="steps">
      <label class="field">
        <span class="field-label">1. CSVファイル</span>
        <input type="file" id="csvInput" accept=".csv,text/csv,text/plain" />
        <span class="file-name" id="csvName">未選択</span>
      </label>

      <label class="field">
        <span class="field-label">2. 更新対象の app.js</span>
        <input type="file" id="appInput" accept=".js,text/javascript" />
        <span class="file-name" id="appName">未選択</span>
      </label>
    </section>

    <section class="preview" aria-live="polite">
      <h2>プレビュー</h2>
      <p class="preview-meta" id="previewMeta">CSVを選択すると内容を確認できます。</p>
      <ol class="preview-list" id="previewList"></ol>
    </section>

    <div class="actions">
      <button type="button" class="primary" id="updateButton" disabled>app.js を更新して保存</button>
      <button type="button" class="secondary" id="downloadCsvButton" disabled>quotes.csv も保存</button>
    </div>

    <p class="status" id="status" role="status"></p>
    <p class="hint">Chrome / Edge なら上書き保存できます。ほかのブラウザではダウンロードで保存されます。</p>
  </main>

  <script src="update.js"></script>
</body>
</html>
